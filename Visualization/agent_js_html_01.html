<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 AI 에이전트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .chat-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-message {
            background: #667eea;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        
        .agent-message {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }
        
        .thinking {
            color: #999;
            font-style: italic;
            font-size: 14px;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
        }
        
        #taskInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border 0.3s;
        }
        
        #taskInput:focus {
            outline: none;
            border-color: #667eea;
        }
        
        #runBtn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        #runBtn:hover {
            background: #5568d3;
        }
        
        #runBtn:active {
            transform: scale(0.98);
        }
        
        .examples {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
        
        .example-btn {
            display: inline-block;
            margin: 5px 5px 5px 0;
            padding: 6px 12px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .example-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 간단한 AI 에이전트</h1>
        <p class="subtitle">ReAct 패턴으로 작동하는 미니 에이전트</p>
        
        <div class="chat-box" id="chatBox"></div>
        
        <div class="input-container">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="할 일을 입력하세요..."
                onkeypress="if(event.key === 'Enter') runAgent()"
            >
            <button id="runBtn" onclick="runAgent()">실행 🚀</button>
        </div>
        
        <div class="examples">
            💡 예시를 클릭해보세요:
            <div>
                <span class="example-btn" onclick="setExample('50 + 37 계산해줘')">계산하기</span>
                <span class="example-btn" onclick="setExample('파이썬 검색해줘')">검색하기</span>
                <span class="example-btn" onclick="setExample('오늘 날씨 알려줘')">날씨 확인</span>
            </div>
        </div>
    </div>

    <script>
        // 🤖 간단한 AI 에이전트 클래스
        class SimpleAgent {
            constructor(name) {
                this.name = name;
                this.memory = [];
            }
            
            // 🧠 추론 단계
            think(task) {
                const thinking = `🧠 생각 중: "${task}"`;
                this.addMessage(thinking, 'thinking');
                
                // 키워드 기반 도구 선택
                if (task.match(/\d+\s*[+\-*/]\s*\d+/) || task.includes('계산')) {
                    return { tool: 'calculate', task };
                } else if (task.includes('검색') || task.includes('찾아')) {
                    return { tool: 'search', task };
                } else if (task.includes('날씨')) {
                    return { tool: 'weather', task };
                } else {
                    return { tool: 'chat', task };
                }
            }
            
            // ⚡ 행동 단계
            act(decision) {
                const { tool, task } = decision;
                
                switch(tool) {
                    case 'calculate':
                        return this.calculate(task);
                    case 'search':
                        return this.search(task);
                    case 'weather':
                        return this.weather(task);
                    default:
                        return this.chat(task);
                }
            }
            
            // 🛠️ 도구들
            calculate(task) {
                const match = task.match(/(\d+)\s*([+\-*/])\s*(\d+)/);
                if (match) {
                    const [_, num1, op, num2] = match;
                    const a = parseFloat(num1);
                    const b = parseFloat(num2);
                    let result;
                    
                    switch(op) {
                        case '+': result = a + b; break;
                        case '-': result = a - b; break;
                        case '*': result = a * b; break;
                        case '/': result = a / b; break;
                    }
                    
                    return `⚡ 계산 완료!\n${a} ${op} ${b} = ${result}`;
                }
                return '❌ 계산식을 이해하지 못했어요';
            }
            
            search(task) {
                const keyword = task.replace(/검색|찾아|줘/g, '').trim();
                return `⚡ 검색 완료!\n"${keyword}"에 대한 정보를 찾았어요 📚`;
            }
            
            weather(task) {
                const weathers = ['☀️ 맑음', '⛅ 구름 조금', '☁️ 흐림', '🌧️ 비'];
                const temp = Math.floor(Math.random() * 20) + 10;
                const weather = weathers[Math.floor(Math.random() * weathers.length)];
                return `⚡ 날씨 확인!\n오늘은 ${weather}, 기온 ${temp}°C 예요`;
            }
            
            chat(task) {
                return `⚡ 응답:\n"${task}"에 대해 더 구체적으로 말씀해주시면 도와드릴게요! 😊`;
            }
            
            // 💬 메시지 추가
            addMessage(text, type) {
                const chatBox = document.getElementById('chatBox');
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${type}`;
                msgDiv.textContent = text;
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
            
            // 🎯 메인 실행
            async run(task) {
                // 사용자 메시지 표시
                this.addMessage(task, 'user-message');
                
                // 짧은 지연으로 자연스러운 느낌
                await new Promise(r => setTimeout(r, 500));
                
                // 1. 추론 단계
                const decision = this.think(task);
                
                await new Promise(r => setTimeout(r, 800));
                
                // 2. 행동 단계
                const result = this.act(decision);
                
                // 결과 저장
                this.memory.push({ task, result });
                
                // 결과 표시
                this.addMessage(result, 'agent-message');
            }
        }
        
        // 전역 에이전트 생성
        const agent = new SimpleAgent('도우미봇');
        
        // 🚀 에이전트 실행 함수
        async function runAgent() {
            const input = document.getElementById('taskInput');
            const task = input.value.trim();
            
            if (!task) {
                alert('할 일을 입력해주세요!');
                return;
            }
            
            input.value = '';
            await agent.run(task);
        }
        
        // 예시 설정 함수
        function setExample(text) {
            document.getElementById('taskInput').value = text;
        }
        
        // 시작 메시지
        window.onload = () => {
            agent.addMessage('안녕하세요! 👋 무엇을 도와드릴까요?', 'agent-message');
        };
    </script>
</body>
</html>
